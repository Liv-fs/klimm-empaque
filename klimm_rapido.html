<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klimm — Cotización rápida</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F6F3;--surface:#FFF;--border:#E2E0D8;--border-strong:#C8C6BC;
  --text:#1A1A18;--muted:#6B6960;--hint:#A8A69E;
  --accent:#1A6B4A;--accent-bg:#E8F4EE;
  --warn-bg:#FEF3E2;--warn-text:#92560A;
  --danger-bg:#FDECEA;--danger-text:#8B2020;
  --success-bg:#E8F4EE;--success-text:#1A6B4A;
  --info-bg:#E8EEF8;--info-text:#1A3A6B;
  --radius:10px;--radius-sm:6px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;letter-spacing:-0.5px}
.logo span{color:var(--accent)}
.logo-sub{font-size:12px;color:var(--muted);margin-left:4px;font-family:'DM Sans',sans-serif;font-weight:400}
.badge-version{font-size:11px;background:var(--warn-bg);color:var(--warn-text);padding:3px 10px;border-radius:20px;font-weight:500}
main{max-width:860px;margin:0 auto;padding:32px 24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:500;color:var(--hint);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:14px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}
input[type=url],input[type=text]{width:100%;font-size:13px;font-family:'DM Sans',sans-serif;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);outline:none;transition:border 0.15s}
input:focus{border-color:var(--accent)}
button{font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.15s;font-weight:500}
.btn-primary{background:var(--accent);color:#fff;border:none}
.btn-primary:hover{background:#155a3d}
.btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--border-strong);color:var(--text)}
.btn-copy{background:var(--info-bg);color:var(--info-text);border:none;font-size:12px;padding:6px 12px}
.btn-copy:hover{opacity:0.8}
.alert{font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);margin-top:10px;line-height:1.5}
.alert-info{background:var(--info-bg);color:var(--info-text)}
.alert-warn{background:var(--warn-bg);color:var(--warn-text)}
.alert-success{background:var(--success-bg);color:var(--success-text)}
.alert-danger{background:var(--danger-bg);color:var(--danger-text)}
.upload-zone{border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--bg);position:relative}
.upload-zone:hover{border-color:var(--accent);background:var(--accent-bg)}
.upload-zone.has-files{border-color:var(--accent);background:var(--accent-bg)}
.upload-text{font-size:14px;color:var(--muted)}
.upload-sub{font-size:12px;color:var(--hint);margin-top:4px}
.file-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.file-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px}
.file-chip button{background:none;border:none;color:var(--hint);cursor:pointer;font-size:14px;padding:0;line-height:1}
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px}
.result-card.full{grid-column:1/-1}
.result-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;padding-bottom:12px;border-bottom:0.5px solid var(--border)}
.result-cot{font-family:'DM Mono',monospace;font-size:13px;font-weight:500}
.result-dest{font-size:12px;color:var(--muted);margin-top:2px}
.summary-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.summary-label{color:var(--muted)}
.summary-value{font-weight:500;font-family:'DM Mono',monospace}
.confidence-bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px}
.confidence-fill{height:100%;border-radius:2px;background:var(--accent);transition:width 0.3s}
.confidence-label{font-size:11px;color:var(--muted);margin-top:4px}
.pkg-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:12px}
.pkg-row:last-child{border-bottom:none}
.pkg-type{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px}
.pkg-CAJA{background:#F1EFE8;color:#4A4840}
.pkg-BIDON{background:#FDECEA;color:#8B2020}
.pkg-LARGA{background:#E8EEF8;color:#1A3A6B}
.pkg-detail{font-size:11px;color:var(--muted);margin-top:1px}
.cotiza-text{font-size:12px;line-height:1.8;color:var(--text);background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-top:8px;white-space:pre-wrap;font-family:'DM Mono',monospace}
.missing-box{font-size:12px;background:var(--danger-bg);color:var(--danger-text);border-radius:var(--radius-sm);padding:10px 14px;line-height:1.8;margin-top:8px}
.cp-input-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.cp-input-row input{width:120px;flex:none}
.hidden{display:none}
.btn-row{display:flex;gap:8px;margin-top:12px}
.sheet-status-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex:none}
.dot.ok{background:var(--accent)}
.dot.err{background:var(--danger-text)}
.section-divider{font-size:11px;font-weight:500;color:var(--hint);text-transform:uppercase;letter-spacing:0.06em;margin:20px 0 12px}
</style>
</head>
<body>
<header>
  <div><span class="logo">klimm<span>.</span><span class="logo-sub">cotización rápida</span></span></div>
  <span class="badge-version">versión IA</span>
</header>
<main>

  <!-- CONFIGURACIÓN -->
  <div class="card">
    <div class="card-title">Configuración</div>
    <label>API Key de Anthropic</label>
    <input type="password" id="api-key" placeholder="sk-ant-..." style="font-family:monospace">
    <div style="font-size:11px;color:var(--hint);margin-top:4px">Se guarda solo en este navegador. Obtenla en console.anthropic.com</div>
    <div style="height:12px"></div>
    <label>URL del Google Sheet (pestaña "Catalogo")</label>
    <input type="url" id="sheet-url" placeholder="https://docs.google.com/spreadsheets/d/...">
    <div class="sheet-status-row">
      <div class="dot" id="sheet-dot"></div>
      <span id="sheet-status-text">Sin conectar</span>
      <button class="btn-secondary" style="font-size:12px;padding:4px 10px;margin-left:4px" onclick="loadSheet()">Conectar</button>
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn-primary" onclick="saveConfig()">Guardar configuración</button>
    </div>
    <div id="config-status"></div>
  </div>

  <!-- SUBIR PDFs -->
  <div class="card">
    <div class="card-title">Cotizaciones PDF</div>
    <div class="upload-zone" id="drop-zone" onclick="document.getElementById('pdf-input').click()" ondragover="event.preventDefault();this.classList.add('has-files')" ondragleave="this.classList.remove('has-files')" ondrop="handleDrop(event)">
      <div style="font-size:28px;color:var(--hint)">⬆</div>
      <div class="upload-text">Haz clic o arrastra uno o varios PDFs</div>
      <div class="upload-sub">Puedes subir varias cotizaciones a la vez</div>
    </div>
    <input type="file" id="pdf-input" accept=".pdf" multiple style="display:none" onchange="handleFiles(this.files)">
    <div class="file-chips" id="file-chips"></div>
    <div class="btn-row" id="process-row" style="display:none">
      <button class="btn-primary" onclick="processAll()">Calcular empaque →</button>
      <button class="btn-secondary" onclick="clearAll()">Limpiar</button>
    </div>
    <div id="process-status"></div>
  </div>

  <!-- RESULTADOS -->
  <div id="results-section" class="hidden">
    <div class="section-divider">Resultados</div>
    <div class="results-grid" id="results-grid"></div>
    <div class="card" style="margin-top:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="card-title" style="margin-bottom:0">Resumen consolidado para transportista</div>
        <button class="btn-copy" onclick="copyConsolidado()">📋 Copiar</button>
      </div>
      <div class="cotiza-text" id="consolidado-text"></div>
    </div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const CAJA_PESO=15;
const TIPOS={LIQUID_20L:'BIDON',BULK_LONG:'LARGA',BULK_RIGID:'LARGA',LIQUID_5L:'CAJA',PAPER_BULK:'CAJA',BOXABLE:'CAJA',BOXABLE_TOP:'CAJA'};
const SHEET_KEY='klimm_sheet_url';
const API_KEY='klimm_api_key';

let catalog={};
let pendingFiles=[];
let allResults=[];

// --- STORAGE ---
function saveConfig(){
  const key=document.getElementById('api-key').value.trim();
  const url=document.getElementById('sheet-url').value.trim();
  const st=document.getElementById('config-status');
  if(!key.startsWith('sk-ant-')){
    st.innerHTML='<div class="alert alert-danger">La API key debe empezar con sk-ant-</div>';
    return;
  }
  try{
    localStorage.setItem(API_KEY,key);
    localStorage.setItem(SHEET_KEY,url);
    st.innerHTML='<div class="alert alert-success">Configuración guardada correctamente.</div>';
    setTimeout(function(){st.innerHTML='';},3000);
    loadSheet();
  }catch(e){
    st.innerHTML='<div class="alert alert-danger">Error al guardar: '+e.message+'</div>';
  }
}

function saveSheetUrl(){
  try{localStorage.setItem(SHEET_KEY,document.getElementById('sheet-url').value.trim());}catch(e){}
}

function getApiKey(){
  try{return localStorage.getItem(API_KEY)||'';}catch(e){return '';}
}

function loadSavedConfig(){
  try{
    const savedKey=localStorage.getItem(API_KEY);
    const savedUrl=localStorage.getItem(SHEET_KEY);
    if(savedKey) document.getElementById('api-key').value=savedKey;
    if(savedUrl){document.getElementById('sheet-url').value=savedUrl;loadSheet();}
  }catch(e){}
}

// --- NORM ---
function norm(s){
  if(!s) return '';
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}

// --- CSV PARSER ---
function parseCSVRow(row){
  const result=[];let cur='';let inQ=false;
  for(let i=0;i<row.length;i++){
    const ch=row[i];
    if(ch==='"'){if(inQ&&row[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
    else if(ch===','&&!inQ){result.push(cur.trim());cur='';}
    else{cur+=ch;}
  }
  result.push(cur.trim());
  return result;
}

// --- SHEET ---
async function loadSheet(){
  const url=document.getElementById('sheet-url').value.trim();
  const dot=document.getElementById('sheet-dot');
  const st=document.getElementById('sheet-status-text');
  if(!url){st.textContent='Ingresa la URL del Sheet';return;}
  const match=url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(!match){st.textContent='URL no válida';dot.className='dot err';return;}
  st.textContent='Cargando...';dot.className='dot';
  try{
    const res=await fetch('https://docs.google.com/spreadsheets/d/'+match[1]+'/gviz/tq?tqx=out:csv&sheet=Catalogo');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    const lines=text.trim().split('\n');
    const cols=parseCSVRow(lines[0]).map(function(c){return c.toLowerCase().trim();});
    catalog={};
    for(let i=1;i<lines.length;i++){
      const vals=parseCSVRow(lines[i]);
      const r={};
      cols.forEach(function(c,j){r[c]=vals[j]||null;});
      if(r.nombre) catalog[norm(r.nombre)]={cat:r.categoria_empaque,peso:parseFloat(r.peso_kg)||0,nombreOriginal:r.nombre};
    }
    const n=Object.keys(catalog).length;
    st.textContent=n+' productos en catálogo';
    dot.className='dot ok';
    saveSheetUrl();
  }catch(e){
    st.textContent='Error: '+e.message+' — verifica que el Sheet sea público';
    dot.className='dot err';
  }
}

// --- FILE HANDLING ---
function handleDrop(e){
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('has-files');
  handleFiles(e.dataTransfer.files);
}

function handleFiles(files){
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(!f.name.endsWith('.pdf')) continue;
    if(pendingFiles.find(function(p){return p.name===f.name;})) continue;
    pendingFiles.push(f);
  }
  renderChips();
}

function renderChips(){
  const el=document.getElementById('file-chips');
  el.innerHTML=pendingFiles.map(function(f,i){
    return '<div class="file-chip"><span>'+f.name+'</span><button onclick="removeFile('+i+')">×</button></div>';
  }).join('');
  document.getElementById('process-row').style.display=pendingFiles.length>0?'flex':'none';
}

function removeFile(i){
  pendingFiles.splice(i,1);
  renderChips();
}

function clearAll(){
  pendingFiles=[];
  allResults=[];
  renderChips();
  document.getElementById('results-section').classList.add('hidden');
  document.getElementById('process-status').innerHTML='';
}

// --- PDF READING ---
async function readPDF(file){
  const ab=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:ab}).promise;
  let pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    const items=tc.items;
    let pageText='';
    for(let j=0;j<items.length;j++){
      pageText+=items[j].str;
      if(items[j].hasEOL) pageText+='\n';
      else if(j+1<items.length&&Math.abs(items[j].transform[5]-items[j+1].transform[5])>5) pageText+='\n';
      else pageText+=' ';
    }
    pages.push(pageText);
  }
  return pages.join('\n');
}

// --- CP EXTRACTION ---
function extractCP(text){
  const entregaMatch=text.match(/Direcci[oó]n de Entrega[\s\S]{0,400}/i);
  if(!entregaMatch) return null;
  const searchArea=entregaMatch[0];
  // Busca patron: 5 digitos seguidos de espacio y texto (ciudad), no solo numeros solos
  const cpMatch=searchArea.match(/\b(\d{5})\s+[A-Za-z]/);
  return cpMatch?cpMatch[1]:null;
}

// --- COTIZACION NUMBER ---
function extractCotNum(text){
  const m=text.match(/Presupuesto\s*#\s*(\S+)/i);
  return m?m[1]:'S/N';
}

// --- AI PRODUCT EXTRACTION ---
async function extractProductsAI(pdfText){
  const prompt='Eres un extractor de datos. Extrae todos los productos de esta cotización. Responde ÚNICAMENTE con un JSON array válido, sin texto antes ni después, sin backticks, sin explicaciones. Formato exacto: [{"nombre":"nombre del producto","cantidad":3},{"nombre":"otro producto","cantidad":1}]. El nombre es el título del producto (no la descripción). La cantidad es el número entero antes de Unidades.\n\nCotización:\n'+pdfText.substring(0,8000);

  const apiKey=getApiKey();
  if(!apiKey){throw new Error('No hay API key configurada — ve a Configuración y guarda tu API key de Anthropic');}
  const response=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:1000,
      messages:[{role:'user',content:prompt}]
    })
  });

  if(!response.ok){
    const err=await response.json();
    throw new Error(err.error?err.error.message:'Error API: '+response.status);
  }

  const data=await response.json();
  if(!data.content||!data.content[0]) throw new Error('Respuesta vacía de la API');
  const raw=data.content[0].text;
  // Intenta extraer JSON array de la respuesta
  const jsonMatch=raw.match(/\[[\s\S]*?\]/);
  if(jsonMatch){
    try{return JSON.parse(jsonMatch[0]);}catch(e){}
  }
  // Intenta extraer JSON con backticks
  const codeMatch=raw.match(/```(?:json)?([\s\S]*?)```/);
  if(codeMatch){
    try{return JSON.parse(codeMatch[1].trim());}catch(e){}
  }
  // Intenta parsear todo el texto como JSON
  try{return JSON.parse(raw.trim());}catch(e){}
  throw new Error('No se pudo parsear la respuesta de IA. Respuesta: '+raw.substring(0,200));
}

// --- CATALOG LOOKUP ---
function findInCatalog(name){
  const key=norm(name);
  // Match exacto
  if(catalog[key]) return catalog[key];
  // Match por palabras clave — requiere que al menos 70% de las palabras del nombre coincidan
  const keyWords=key.split(' ').filter(function(w){return w.length>3;});
  if(keyWords.length===0) return null;
  let bestMatch=null;
  let bestScore=0;
  for(const k in catalog){
    const matched=keyWords.filter(function(w){return k.includes(w);}).length;
    const score=matched/keyWords.length;
    if(score>bestScore&&score>=0.7){bestScore=score;bestMatch=catalog[k];}
  }
  return bestMatch;
}

// --- CALCULATE PACKING ---
function calcPacking(products){
  let totalBidones=0,totalLargas=0,cajasBoxPeso=0,pesoBidones=0,pesoLargas=0;
  const missing=[];
  const pkgLines=[];
  let totalFound=0,totalProducts=0;

  // Filtrar productos de envío/flete
  const shipKeywords=['envio','flete','shipping','cargo envio','costo envio','tresguerras','paquetexpress','redpack','estafeta','servicio entrega'];
  const filtered=products.filter(function(p){
    const low=norm(p.nombre);
    const isShip=shipKeywords.some(function(k){return low.includes(k);});
    return !isShip;
  });

  filtered.forEach(function(p){
    totalProducts++;
    const data=findInCatalog(p.nombre);
    if(!data){
      missing.push(p.nombre);
      // NO se incluye en el cálculo — se excluye completamente
      pkgLines.push({name:p.nombre,qty:p.cantidad,tipo:'?',detail:'No encontrado en catálogo — excluido del cálculo',estimated:true});
      return;
    }
    totalFound++;
    const tipo=TIPOS[String(data.cat).toUpperCase().trim()]||'CAJA';
    const peso=data.peso||1;
    if(tipo==='BIDON'){
      totalBidones+=p.cantidad;pesoBidones+=p.cantidad*peso;
      pkgLines.push({name:p.nombre,qty:p.cantidad,tipo:tipo,detail:p.cantidad+' pzas · '+peso+' kg c/u',estimated:false});
    } else if(tipo==='LARGA'){
      totalLargas+=p.cantidad;pesoLargas+=p.cantidad*peso;
      pkgLines.push({name:p.nombre,qty:p.cantidad,tipo:tipo,detail:p.cantidad+' pzas · '+peso+' kg c/u',estimated:false});
    } else {
      cajasBoxPeso+=p.cantidad*peso;
      pkgLines.push({name:p.nombre,qty:p.cantidad,tipo:tipo,detail:p.cantidad+' u · '+peso+' kg c/u = '+(p.cantidad*peso).toFixed(1)+' kg',estimated:false});
    }
  });

  const totalCajas=Math.ceil(cajasBoxPeso/CAJA_PESO);
  const pesoTotal=cajasBoxPeso+pesoBidones+pesoLargas;
  const totalPaq=totalCajas+totalBidones+totalLargas;
  const confidence=totalProducts>0?Math.round(totalFound/totalProducts*100):0;
  const isPartial=missing.length>0;

  return {totalCajas,totalBidones,totalLargas,totalPaq,pesoTotal,confidence,missing,pkgLines,cajasBoxPeso,isPartial,totalFound,totalProducts};
}

// --- PROCESS ALL ---
async function processAll(){
  if(pendingFiles.length===0) return;
  if(Object.keys(catalog).length===0){
    document.getElementById('process-status').innerHTML='<div class="alert alert-warn">Carga el catálogo primero antes de procesar.</div>';
    return;
  }
  document.getElementById('process-status').innerHTML='<div class="alert alert-info">Procesando '+pendingFiles.length+' cotización(es) con IA...</div>';
  allResults=[];

  for(let i=0;i<pendingFiles.length;i++){
    const f=pendingFiles[i];
    try{
      const text=await readPDF(f);
      const cotNum=extractCotNum(text);
      const cp=extractCP(text);
      const products=await extractProductsAI(text);
      const packing=calcPacking(products);
      allResults.push({cotNum,cp,products,packing,fileName:f.name,cpManual:null});
    }catch(e){
      allResults.push({cotNum:f.name,cp:null,products:[],packing:null,fileName:f.name,error:e.message,cpManual:null});
    }
  }

  document.getElementById('process-status').innerHTML='';
  renderResults();
}

// --- RENDER RESULTS ---
function renderResults(){
  document.getElementById('results-section').classList.remove('hidden');
  const grid=document.getElementById('results-grid');
  grid.innerHTML='';

  allResults.forEach(function(r,idx){
    const card=document.createElement('div');
    card.className='result-card'+(allResults.length===1?' full':'');

    if(r.error){
      card.innerHTML='<div class="result-header"><div><div class="result-cot">'+r.cotNum+'</div></div></div>'+
        '<div class="alert alert-danger">Error al procesar: '+r.error+'</div>';
      grid.appendChild(card);
      return;
    }

    const p=r.packing;
    const cpHtml=r.cp
      ?'<div style="font-size:12px;color:var(--muted)">CP destino: <strong>'+r.cp+'</strong></div>'
      :'<div class="alert alert-warn" style="margin-top:6px">No se encontró CP en el PDF — <span style="display:inline-flex;align-items:center;gap:6px">ingresa manualmente: <input type="text" id="cp-'+idx+'" placeholder="00000" style="width:80px;font-size:12px;padding:4px 8px" onchange="setManualCP('+idx+',this.value)"></span></div>';

    const missingHtml=p.missing.length>0
      ?'<div class="missing-box"><strong>⚠ '+p.missing.length+' producto(s) excluidos del cálculo</strong> — no están en el catálogo. Agrégalos al Sheet con sus datos para incluirlos:<br>'+
        p.missing.map(function(m){return '• '+m;}).join('<br>')+'</div>':'' ;

    const pkgHtml=p.pkgLines.map(function(l){
      return '<div class="pkg-row"><div>'+
        '<div style="color:var(--text)">'+(l.estimated?'<span style="color:var(--danger-text)">⚠</span> ':'')+l.name+'</div>'+
        '<div class="pkg-detail">'+l.detail+'</div></div>'+
        '<span class="pkg-type pkg-'+l.tipo+'">'+l.tipo+'</span></div>';
    }).join('');

    card.innerHTML=
      '<div class="result-header">'+
        '<div><div class="result-cot">'+r.cotNum+'</div><div class="result-dest">'+r.fileName+'</div></div>'+
        '<button class="btn-copy" onclick="copyResult('+idx+')">📋 Copiar</button>'+
      '</div>'+
      cpHtml+
      '<div style="margin-top:12px">'+
        '<div class="summary-row"><span class="summary-label">Total paquetes</span><span class="summary-value">'+p.totalPaq+'</span></div>'+
        '<div class="summary-row"><span class="summary-label">Peso total aprox.</span><span class="summary-value">'+p.pesoTotal.toFixed(0)+' kg</span></div>'+
        '<div class="summary-row"><span class="summary-label">Cajas 40×40×40</span><span class="summary-value">'+p.totalCajas+'</span></div>'+
        (p.totalBidones>0?'<div class="summary-row"><span class="summary-label">Bidones 20L sueltos</span><span class="summary-value">'+p.totalBidones+'</span></div>':'')+
        (p.totalLargas>0?'<div class="summary-row"><span class="summary-label">Piezas largas</span><span class="summary-value">'+p.totalLargas+' (hasta 170 cm)</span></div>':'')+
        '<div class="confidence-bar"><div class="confidence-fill" style="width:'+p.confidence+'%"></div></div>'+
        '<div class="confidence-label">Confianza: '+p.confidence+'% peso real ('+( 100-p.confidence)+'% estimado)</div>'+
      '</div>'+
      missingHtml+
      '<div style="margin-top:12px;border-top:0.5px solid var(--border);padding-top:10px">'+pkgHtml+'</div>';

    grid.appendChild(card);
  });

  renderConsolidado();
}

function setManualCP(idx,val){
  allResults[idx].cpManual=val.trim();
  renderConsolidado();
}

// --- COPY ---
function buildResultText(r){
  if(!r.packing) return r.cotNum+': error al procesar';
  const p=r.packing;
  const cp=r.cpManual||r.cp||'[CP no encontrado]';
  let lines=[
    'Cotización '+r.cotNum,
    'Carga consolidada',
    'Origen: 53569 CDMX → Destino: '+cp,
    'Total bultos: '+p.totalPaq,
    'Peso total: '+p.pesoTotal.toFixed(0)+' kg',
    'Cajas 40×40×40 cm: '+p.totalCajas+' pzas (~'+CAJA_PESO+' kg c/u)',
  ];
  if(p.totalBidones>0) lines.push('Bidones 20L sueltos: '+p.totalBidones+' pzas · 21 kg · 30×30×45 cm');
  if(p.totalLargas>0) lines.push('Piezas largas emplayadas: '+p.totalLargas+' pzas · hasta 170 cm');
  lines.push('Mercancía: Productos de limpieza (sin materiales peligrosos)');
  if(p.totalLargas>0) lines.push('⚠ Mencionar: piezas de hasta 170 cm (mops, bastones, mechudos)');
  if(p.isPartial) lines.push('⚠ RESULTADO PARCIAL: '+p.totalFound+' de '+p.totalProducts+' productos encontrados en catálogo — '+p.missing.length+' excluidos del cálculo');
  return lines.join('\n');
}

function copyResult(idx){
  const text=buildResultText(allResults[idx]);
  navigator.clipboard.writeText(text).then(function(){alert('Copiado al portapapeles');});
}

function renderConsolidado(){
  if(allResults.length===0) return;
  const text=allResults.map(buildResultText).join('\n\n---\n\n');
  document.getElementById('consolidado-text').textContent=text;
}

function copyConsolidado(){
  const text=document.getElementById('consolidado-text').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('Copiado al portapapeles');});
}

// --- INIT ---
window.onload=function(){loadSavedConfig();};
</script>
